<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="阿金的个人主页，记录用 AI 做 App、小游戏和视频的过程。">
<title>阿金 · AI 项目与创作</title>
<style>
  :root { color-scheme: light; --ink:#242039; --muted:#615b72; --paper:#f9f7f0; --line:#ded9e6; --purple:#4931a5; --lime:#dbfa82; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; color:var(--ink); background:var(--paper); font:16px/1.65 "Inter","PingFang SC","Microsoft YaHei",sans-serif; }
  a { color:inherit; text-decoration:none; }
  a:focus-visible { outline:3px solid #7251d4; outline-offset:5px; }
  .shell { width:min(1120px,calc(100% - 80px)); margin-inline:auto; }
  header { border-bottom:1px solid var(--line); }
  nav { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:11px; font-weight:800; }
  .stamp { width:30px; height:30px; display:grid; place-items:center; background:var(--purple); color:#fff; border-radius:8px; font-size:13px; }
  .nav-links { display:flex; align-items:center; gap:26px; color:var(--muted); font-size:14px; font-weight:650; }
  .nav-links a:hover, footer a:hover { color:var(--purple); text-decoration:underline; }
  .hero { min-height:500px; display:grid; grid-template-columns:1.18fr 1fr; align-items:center; gap:65px; padding-block:66px; }
  .intro { margin:0 0 13px; color:var(--purple); font-weight:750; }
  h1,h2,h3,p { margin-top:0; }
  h1 { margin-bottom:22px; font-size:clamp(44px,6vw,82px); font-weight:900; line-height:1.08; letter-spacing:-.078em; }
  h1 span { color:var(--purple); }
  .lead { max-width:400px; margin-bottom:28px; color:var(--muted); font-size:17px; }
  .button { display:inline-flex; align-items:center; gap:14px; min-height:46px; padding:9px 17px; border-radius:9px; background:var(--ink); color:#fff; font-size:14px; font-weight:700; }
  .button:hover { background:var(--purple); }
  .art { min-height:350px; position:relative; isolation:isolate; overflow:hidden; display:grid; place-items:center; border-radius:24px; background:#e9e0fb; }
  .art::before { content:""; position:absolute; inset:0; z-index:-1; background-image:radial-gradient(#8e7ab9 1px,transparent 1px); background-size:17px 17px; opacity:.49; }
  .art::after { content:""; position:absolute; width:72%; aspect-ratio:1; border:1px solid #937ac6; border-radius:50%; z-index:-1; }
  .art-window { position:relative; width:66%; aspect-ratio:1.26; display:grid; place-items:center; padding-top:17px; transform:rotate(-9deg); background:#f9f7f0; border:2px solid var(--ink); border-radius:15px; box-shadow:9px 10px 0 #9275d4; }
  .window-bar { position:absolute; inset:0 0 auto; height:26px; display:flex; align-items:center; gap:5px; padding-inline:10px; border-bottom:2px solid var(--ink); }
  .window-bar i { width:6px; height:6px; border-radius:50%; background:var(--purple); }
  .art-mark { font-size:clamp(63px,11vw,144px); line-height:1; letter-spacing:-.095em; font-weight:900; color:var(--purple); padding-right:.08em; }
  .spark { position:absolute; top:18%; right:10%; width:22%; aspect-ratio:1; border:2px solid var(--ink); border-radius:50%; display:grid; place-items:center; transform:rotate(12deg); color:var(--ink); background:var(--lime); font-size:clamp(30px,6vw,74px); line-height:1; }
  .work { border-top:1px solid var(--line); padding-block:40px 64px; }
  h2 { margin-bottom:22px; font-size:32px; letter-spacing:-.06em; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  article { padding:23px 22px; border-radius:14px; border:1px solid var(--line); background:#fffdfa; }
  h3 { margin-bottom:6px; font-size:20px; }
  article p { margin-bottom:0; color:var(--muted); font-size:14px; }
  footer { border-top:1px solid var(--line); }
  .footer-content { min-height:78px; display:flex; justify-content:space-between; align-items:center; gap:14px; font-size:14px; }
  .footer-content a { color:var(--purple); font-weight:700; }
  @media (max-width:800px) {
    .shell { width:calc(100% - 44px); }
    .hero { gap:25px; padding-block:44px; min-height:auto; }
    .art { min-height:275px; }
  }
  @media (max-width:620px) {
    nav { min-height:58px; }
    .nav-links { gap:16px; font-size:13px; }
    .hero { grid-template-columns:1fr; gap:30px; padding-block:40px 35px; }
    .art { min-height:0; aspect-ratio:1.4; }
    .cards { grid-template-columns:1fr; }
    .lead { font-size:16px; }
    .work { padding-block:28px 42px; }
  }
  @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }

  .art-window { transform-origin:center; animation:window-boot 540ms cubic-bezier(.22,.78,.22,1) both; }
  .art-window { display:flex; flex-direction:column; align-items:stretch; padding-top:0; overflow:hidden; }
  .window-bar { position:relative; flex:none; }
  .portrait-stage { position:relative; flex:1; min-height:0; background:#fff; }
  .portrait-stage video { display:block; width:100%; height:100%; object-fit:contain; }
  .portrait-play { position:absolute; right:7px; bottom:7px; padding:5px 9px; border:0; border-radius:6px; background:var(--ink); color:white; font:inherit; font-size:12px; cursor:pointer; }
  .portrait-play:focus-visible { outline:3px solid #9275d4; outline-offset:2px; }
  .spark { pointer-events:none; }
  .spark { animation:spark-boot 520ms cubic-bezier(.22,.8,.3,1) 140ms both; }
  @keyframes window-boot {
    0% { transform:rotate(-9deg) scale(.94,.025); opacity:0; box-shadow:0 0 0 #9275d4; }
    32% { transform:rotate(-9deg) scale(.96,.08); opacity:1; }
    74% { transform:rotate(-11deg) scale(1.035,1.055); }
    100% { transform:rotate(-9deg) scale(1); }
  }
  @keyframes mark-boot {
    0% { transform:translateY(12px) scale(.78); opacity:0; }
    100% { transform:translateY(0) scale(1); opacity:1; }
  }
  @keyframes spark-boot {
    0% { transform:rotate(-165deg) scale(.3); opacity:0; }
    100% { transform:rotate(12deg) scale(1); opacity:1; }
  }
  .cards { align-items:start; }
  .project { padding:0; overflow:hidden; transition:border-color 180ms, box-shadow 180ms; }
  .project:hover, .project:has(details[open]) { border-color:#a58cdb; box-shadow:0 8px 25px #4931a516; }
  summary { position:relative; padding:22px; cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary:focus-visible { outline:3px solid #7251d4; outline-offset:-4px; border-radius:12px; }
  summary .project-title { display:block; padding-right:30px; margin-bottom:6px; font-size:20px; font-weight:750; }
  summary .project-description { display:block; color:var(--muted); font-size:14px; }
  .expander { position:absolute; top:21px; right:19px; width:25px; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; background:#efe8fb; color:var(--purple); font-size:19px; transition:transform 200ms, background-color 200ms; }
  [open] .expander { transform:rotate(45deg); background:var(--lime); }
  .project-preview { margin:0; padding:15px 17px 19px; border-top:1px solid var(--line); }
  [open] .project-preview { animation:preview-in 230ms ease-out both; }
  @keyframes preview-in {
    from { opacity:0; transform:translateY(-6px); }
    to { opacity:1; transform:translateY(0); }
  }
  .project-preview img { display:block; width:100%; height:auto; border-radius:8px; }
  .project-preview .tall-preview { width:min(100%,220px); margin:auto; }
  .project-preview figcaption { margin-top:10px; color:var(--muted); font-size:13px; }
  .comparison { margin:0; min-width:0; padding:0; border:0; }
  .comparison legend { padding:0; margin-bottom:7px; font-size:13px; font-weight:700; }
  .comparison label { display:inline-flex; gap:4px; align-items:center; margin-right:10px; cursor:pointer; font-size:13px; }
  .comparison input { margin:0; accent-color:var(--purple); }
  .stage { position:relative; margin-top:10px; aspect-ratio:16/9; overflow:hidden; border:1px solid #9a86c7; border-radius:8px; background:#e1d8fa; }
  .recording { position:absolute; inset:12% 9%; display:grid; place-items:center; background:#513a99; color:#fff; border-radius:6px; font-size:14px; }
  .overlay { position:absolute; right:12%; bottom:17%; width:36%; height:32%; display:grid; place-items:center; border:2px solid #fff; border-radius:6px; background:var(--lime); font-size:12px; font-weight:750; }
  .comparison:has(#edit-before:checked) .recording { z-index:1; }
  @media (prefers-reduced-motion:reduce) {
    .art-window, .art-mark, .spark, [open] .project-preview { animation:none; }
    .project, .expander { transition:none; }
  }
</style>
</head>

  const portrait = document.getElementById("portrait-film");

  function playPortrait() {
    portrait.play().catch(() => { portraitPlay.textContent = "播放"; });
  }
  portraitPlay.addEventListener("click", () => {
    if (portrait.paused) {
      if (portrait.ended) portrait.currentTime = 0;
      playPortrait();
    } else {
      portrait.pause();
    }
  });
  portrait.addEventListener("play", () => { portraitPlay.textContent = "暂停"; });
  portrait.addEventListener("pause", () => { portraitPlay.textContent = portrait.ended ? "重播" : "继续"; });
